#Resilinece4j CircuitBreaker Properties
# CircuitBreaker: Monitors the success and failure rates of calls, automatically transitioning between open, half-open, and closed states based on
# defined thresholds and sliding window configuration. It helps to prevent system overload by cutting off problematic calls.
# Registers a health indicator for the inventory CircuitBreaker, making it available for health monitoring.
resilience4j.circuitbreaker.instances.inventory.registerHealthIndicator=true
# Specifies the buffer size for event consumers. This buffer will hold the last 10 CircuitBreaker events (like successful calls, failed calls, etc.).
resilience4j.circuitbreaker.instances.inventory.event-consumer-buffer-size=10
# Count-based sliding window: Aggregates the outcome of the last N calls.
# Time-based sliding window: Aggregates the outcome of calls within the last N seconds.
# Defines the type of sliding window used by the CircuitBreaker i.e. COUNT_BASED or TIME_BASED . Here, it is COUNT_BASED, which means the window will count the number of calls.
resilience4j.circuitbreaker.instances.inventory.slidingWindowType=COUNT_BASED
# Sets the size of the sliding window. In this case, the last 10 calls are considered when evaluating the state of the CircuitBreaker. if 10 back to back request are failing then state will change
resilience4j.circuitbreaker.instances.inventory.slidingWindowSize=10
# Specifies the failure rate threshold in percentage. If more than 50% of the calls in the sliding window fail, the CircuitBreaker transitions to the open state. that means more than 5 requests are failing then circuit breaker is on
resilience4j.circuitbreaker.instances.inventory.failureRateThreshold=50
# Defines the duration the CircuitBreaker stays in the open state before transitioning to the half-open state, which is 5 seconds.
resilience4j.circuitbreaker.instances.inventory.waitDurationInOpenState=5s
# Sets the number of permitted calls when the CircuitBreaker is in the half-open state. Here, 3 calls are allowed to test the service's health.
resilience4j.circuitbreaker.instances.inventory.permittedNumberOfCallsInHalfOpenState=3
# Enables the automatic transition from the open state to the half-open state after the wait duration elapses.
resilience4j.circuitbreaker.instances.inventory.automaticTransitionFromOpenToHalfOpenEnabled=true
# Defines the minimum number of calls that must be recorded in the sliding window for the CircuitBreaker to calculate the failure rate. This ensures a meaningful calculation by considering at least 5 calls.
# if we don't set this property then cicrcuitBreaker will not open until all the 10 requests are failed which is defined in slidingWindowSize it will not take the failureRateThreshold into consideration
# the minimum number of calls required within the sliding window for the CircuitBreaker to consider transitioning states.
resilience4j.circuitbreaker.instances.inventory.minimum-number-of-calls=5

#Resilience4J Timeout Properties
# TimeLimiter: Ensures that calls do not hang indefinitely by specifying a maximum allowed execution time.
# Sets the timeout duration for the inventory TimeLimiter. If the execution of a call takes longer than 3 seconds, it will be timed out.
resilience4j.timelimiter.instances.inventory.timeout-duration=3s

#Resilience4J Retry Properties
# Retry: Automatically retries failed calls up to a specified number of attempts with a delay between each attempt.
# Specifies the maximum number of retry attempts for the inventory instance. In this case, the system will retry the call up to 3 times.
resilience4j.retry.instances.inventory.max-attempts=3
# Defines the wait duration between retry attempts. Here, there will be a 5-second wait between each retry attempt.
resilience4j.retry.instances.inventory.wait-duration=10s

