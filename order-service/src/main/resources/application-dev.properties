#Kafka Properties
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.template.default-topic=order-placed
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
# since we are serializing in the form of AVRO Schema
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
# if we are not using AVRO Schema for Serialization and Deserialization
#spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Defining the URL to refer to the Schema Registry here 8091 is the port that is mapped on the host machine to the Kafka Schema Registry Docker Container running on port 8081
spring.kafka.producer.properties.schema.registry.url=http://localhost:8091

# This property is important to add about mapping type .here trying to serialize the orderPlacedEvent and in notification-service whenever we receive this information from order-service
# we have to provide mapping type on site in the producer side and also consumer side
# on the producer side we will define what exactly is the type which we are sending for OrderPlacedEvent and on consumer side
# we will also define what is the exact type we are expecting . Here we are providing json type mapping as part of this json type mapping
# we are providing token value followed by the fully qualified class name of the body we are sending as part of the message
# the token value i have provided as some random value as event and followed by the fully qualified class name of the OrderPlacedEvent
# this way springboot will understand what is the json type mapping of the OrderPlacedEvent so we have to define the similar property at consumer side too.
# HERE TOKEN VALUE i.e. "event"  MUST BE SAME AT BOTH CONSUMER AND PRODUCER SIDE
#spring.kafka.producer.properties.spring.json.type.mapping=event:com.mylearning.event.OrderPlacedEvent



# Actuator Endpoints
# After adding the properties run application and open the URL ? http://localhost:8086/actuator/prometheus to see different metrics that are exposed by the micrometer.
# this property exposes the endpoints health, info, metrics, and prometheus through the actuator.
management.endpoints.web.exposure.include=health, info, metrics, prometheus
# this is the internal property of prometheus we need to add this as true
# this property  is used by the micrometer to gather the metrics in the form of a histogram and send it to Prometheus.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=ORDER-SERVICE
# management.metrics.export.prometheus.enabled=true this is Deprecated now use below setting
# enables the export of metrics to Prometheus.
management.prometheus.metrics.export.enabled=true
# This property enables the Prometheus endpoint in your application. With this property enabled, you can access the Prometheus metrics endpoint at http://localhost:8086/actuator/prometheus
management.endpoint.prometheus.enabled=true



# this property is mandatory
# Micrometer Tracing will only send 10% of the traces it generates to Tempo, just to avoid overwhelming it with a lot of requests.
# We can set it to 100% by adding the below property to our application.yml file
# By default springboot will generate traces for only 10% of the requests
# by setting it to 1.0 we are setting so that it will generate 100% traces of all the requests which is processed by the application
management.tracing.sampling.probability=1.0
